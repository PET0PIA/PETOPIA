# 애플리케이션 계층 (운영) — 인스턴스 A 에서 실행한다.
#
# 토폴로지: t3.micro 2대.
#   인스턴스 A : 애플리케이션      -> 이 파일
#   인스턴스 B : MySQL + Redis     -> docker-compose.release.yaml
#
# 인스턴스 A 와 B 의 .env 는 내용이 다르다.
# 각 인스턴스에 필요한 변수 목록은 .env.example 을 단일 출처로 삼는다.
# 여기에 목록을 복제해 두었더니 실제로 어긋났다(A 목록에서 DB_PORT / DB_DATABASE /
# DB_USER / REDIS_PORT 가 누락). 같은 목록을 두 곳에서 관리하지 않는다.
#
# 특히 주의: 값을 생략하면 application-release.yaml 의 기본값
# (3306 / petopia_db / petopia_user / 6379)이 조용히 쓰인다. 인스턴스 B 에서
# 비기본값을 쓰는데 A 에 명시하지 않으면 접속이 실패한다.
#
# 두 .env 는 배포 시 SSM Parameter Store 에서 받아 생성한다. 커밋하지 않는다.
#
# 실행(보통은 SSM Send-Command 가 대신 수행한다):
#   docker compose -f docker-compose.app.yaml up -d
services:
  app:
    # 커밋 SHA 로 태그된 ECR 이미지. latest 를 쓰지 않는 이유는 어떤 커밋이
    # 떠 있는지 모호해지고 롤백 대상을 특정할 수 없기 때문이다.
    # 예: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/petopia:a0c843f
    image: ${APP_IMAGE}
    container_name: petopia-app
    # Flyway 는 컨텍스트 리프레시 시점에 DB 에 접속하고 connection-timeout 이
    # 3초라, MySQL 이 아직 준비되지 않았으면 앱이 즉시 죽는다.
    # depends_on 은 호스트가 달라 쓸 수 없으므로, 재시작 정책으로 재시도한다.
    # 첫 부팅이나 DB 재시작 구간에서 컨테이너가 몇 차례 재시작하는 것이 정상이다.
    restart: unless-stopped
    # Spring graceful shutdown 은 종료 단계를 최대 20초 기다린다(application.yaml).
    # compose 기본 종료 유예는 10초라 그 전에 SIGKILL 되어 진행 중 요청·SSE 가 잘린다.
    # 20초보다 넉넉히 줘서 graceful shutdown 이 실제로 끝나게 한다.
    stop_grace_period: 30s
    env_file: .env
    ports:
      # SG(petopia-app-sg)에서 8080 인바운드를 개발자 IP 로만 제한한다.
      # 프론트엔드가 배포되면 그때 범위를 넓힌다. 넓히기 전에
      # /api/reservation/health 하위의 디버그 엔드포인트(error/logs/echo)를
      # 먼저 정리할 것. 인증이 전혀 없다.
      - "8080:8080"
      # 관리 포트(actuator health). 2단계에서 ALB 헬스체크가
      # :8081/actuator/health/liveness 를 물린다. 그때는 SG 에서 ALB 보안그룹만
      # 8081 인바운드를 열 것. 지금(ALB 이전)은 물어볼 주체가 없어 실효는 없고,
      # 헬스체크를 사람이 수동으로 확인하는 용도로만 열어 둔다.
      - "8081:8081"
    environment:
      # 이미지에도 박아 두었지만, 운영에서 로컬 프로필로 뜨는 사고를 막기 위해
      # 여기서 한 번 더 명시한다.
      SPRING_PROFILES_ACTIVE: release
      TZ: Asia/Seoul
    # 총 1GiB 중 OS 와 dockerd 몫을 남긴다.
    # 이미지의 JAVA_TOOL_OPTIONS 가 MaxRAMPercentage=70 이므로 힙은 약 448MB,
    # 나머지는 메타스페이스 / 스레드 스택 / 다이렉트 버퍼가 쓴다.
    mem_limit: 640m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
