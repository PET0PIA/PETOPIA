name: Backend CI

# 브랜치 모델
#   dev  : 통합 브랜치. 기능 PR 이 여기로 들어온다.
#   main : 릴리즈 브랜치. dev -> main PR 이 릴리즈 게이트이고,
#          main 에 머지되는 시점이 배포 시점이다.
#   따라서 dev 로 가는 PR 과 main 으로 가는 릴리즈 PR 을 모두 게이트한다.
#
# 이 워크플로가 만드는 체크 이름은 "Backend CI / Backend CI" 다.
# 브랜치 보호의 필수 체크로 등록한 뒤에는 name / job id 를 바꾸지 않는다.
# 이름이 바뀌면 등록된 필수 체크가 고아가 되어 PR이 영구 pending 상태로 막힌다.

on:
  # dev  : 기능 PR 게이트
  # main : dev -> main 릴리즈 PR 게이트. 배포 전 마지막 검증 지점이다.
  pull_request:
    branches: [dev, main]
  # push 실행의 목적은 두 가지다.
  #   1) 모든 PR이 읽을 수 있는 공용 Gradle 캐시를 채운다.
  #      PR ref(refs/pull/N/merge)로 저장한 캐시는 다른 PR이 읽지 못한다.
  #   2) 실제로 머지된 결과를 검증한다. pull_request 는 PR 시점의 머지 결과라 시간이 지나면 낡는다.
  #
  # main push 는 릴리즈 시점이다. 배포(CD) job 은 나중에 이 이벤트에
  # needs: backend-ci 로 붙는다. 테스트가 통과하지 않으면 배포되지 않게 하기 위함이다.
  # 지금은 CD 가 없으므로 검증만 한 번 더 돈다.
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 같은 PR에 새 커밋이 오면 이전 실행을 취소한다.
  # push 실행은 취소하지 않는다. dev push 는 공용 캐시를 채우는 역할이고,
  # main push 는 릴리즈(배포) 시점이므로 중간에 취소되면 안 된다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# paths 필터를 의도적으로 쓰지 않는다.
#   워크플로 레벨 paths 로 걸러진 PR은 체크 런이 아예 생성되지 않는다.
#   이 체크를 필수 체크로 등록하면 frontend/ 만 고친 PR이 "Waiting for status" 로
#   영구 정지하고, 타임아웃도 자기 회복도 없다. dev 에는 frontend/ 가 실제로 존재한다.
#   공개 저장소라 Actions 분이 무료이므로 필터로 아낄 비용도 0이다.
#   훗날 정말 필요하면 job 레벨 if: 로 건너뛴다. skipped 는 필수 체크에서 성공으로 취급된다.

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    # 기본값이 360분(6시간)이다. 테스트가 소켓에서 멈추면 러너를 그만큼 붙잡는다.
    timeout-minutes: 20

    env:
      # 컨테이너(TZ=Asia/Seoul)와 JDBC serverTimezone=Asia/Seoul 에 JVM 기본 시간대를 맞춘다.
      TZ: Asia/Seoul

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          # 기본값(true)은 GITHUB_TOKEN 을 .git/config 의 extraheader 로 남긴다.
          # 이 워크플로는 체크아웃 이후 git 을 전혀 쓰지 않으므로 남길 이유가 없다.
          # (build.gradle 에도 git 기반 버저닝이 없다.)
          persist-credentials: false

      # MySQL 초기화에 10~20초가 더 걸린다(README §3 참고).
      # JDK/Gradle 준비보다 앞에 두어 그 시간을 겹치게 한다. 순서가 성능의 핵심이다.
      #
      # GitHub Actions services: 블록 대신 저장소의 compose 파일을 쓰는 이유
      #   - services: 컨테이너는 checkout 보다 먼저 시작된다. 그래서 저장소 안의 어떤 파일도
      #     참조할 수 없다 (command, my.cnf, 초기화 SQL 전부 불가). volumes: 는 문법상 되지만
      #     그 시점 워크스페이스가 비어 있어 무의미하다.
      #   - docker-compose.yaml 의 계정/DB 이름이 application-local.yaml 기본값과 이미 일치한다.
      #     services: 를 쓰면 그 값들을 워크플로에 복제해야 하고, 두 파일이 어긋나면
      #     원인을 찾기 어려운 인증 실패로 나타난다.
      #   - CI가 깨졌을 때 로컬에서 똑같은 두 명령으로 재현된다.
      - name: 인프라 컨테이너 기동 (MySQL + Redis)
        run: docker compose -f docker-compose.yaml up -d --quiet-pull

      # 러너에 Temurin 21 이 이미 있어 tool cache 히트로 1~2초면 끝난다(다운로드 없음).
      # 러너 기본 JAVA_HOME 은 17 이므로 이 단계가 없으면 Gradle 데몬이 17로 뜬다.
      # JAVA_HOME 이 21을 가리키면 build.gradle 의 toolchain(21) 이 현재 JVM 으로 충족된다.
      # settings.gradle 에 foojay resolver 가 없어 Gradle 이 JDK 를 직접 받아올 수 없기 때문에
      # 이 단계는 선택이 아니라 필수다.
      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # cache: gradle 을 쓰지 않는다. 단순 디렉터리 캐시라 무한히 커지고
          # setup-gradle 의 캐시와 충돌한다.

      - name: Gradle 준비 (캐시 + 래퍼 검증)
        uses: gradle/actions/setup-gradle@v4
        with:
          # 커밋된 gradle-wrapper.jar 를 공식 배포 체크섬과 대조한다.
          validate-wrappers: true
          # PR ref 로 저장한 캐시는 다른 PR이 읽지 못한다. 저장만 하면 시간을 쓰고
          # 10GB 캐시 한도에서 정작 공용으로 쓰이는 dev 캐시를 밀어낸다.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Hikari connection-timeout 이 3초(application.yaml)다. 준비 전에 Gradle 을 띄우면 그대로 실패한다.
      #
      # README §3 의 `mysqladmin ping -upetopia_user ...` 는 -h 가 없어 유닉스 소켓으로 붙는다.
      # 공식 엔트리포인트의 초기화 단계 임시 서버는 --skip-networking 으로 뜨므로
      # TCP :3306 이 아직 안 열렸는데도 그 ping 은 성공한다. CI 게이트로 쓸 수 없다.
      #
      # 아래 검사는 네 가지를 한 번에 증명한다.
      #   TCP 리스닝 / petopia_user 존재 / petopia_db 존재 / 권한 부여 완료
      - name: MySQL 준비 대기
        run: |
          set -uo pipefail
          deadline=$(( SECONDS + 120 ))
          until docker exec petopia-mysql-local \
                  mysql --protocol=TCP -h 127.0.0.1 -P 3306 \
                        -upetopia_user -p'userpassword123!' \
                        -D petopia_db -e 'SELECT 1' > /dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=MySQL 준비 실패::120초 안에 petopia_db 에 접속하지 못했다. 아래 컨테이너 로그를 확인한다."
              exit 1
            fi
            echo "MySQL 대기 중... (${SECONDS}s)"
            sleep 2
          done
          echo "MySQL 준비 완료 (${SECONDS}s)"

      # build = assemble + check 이고 check 는 test 에 의존한다.
      # 전체 테스트와 bootJar 생성을 한 번에 검증한다. 배포는 하지 않는다.
      - name: 빌드 및 테스트
        run: ./gradlew build --console=plain --stacktrace

      # 운영 이미지가 실제로 빌드되는지 확인한다. 푸시는 하지 않는다.
      # 여기서 잡히는 것들:
      #   - .dockerignore 의 3단 규칙(* -> !build/libs/*.jar -> *-plain.jar 제외)이
      #     정말 jar 하나만 남기는지. 둘 남으면 COPY 가 소스 2개를 잡아 실패한다.
      #   - -Djarmode=tools ... extract --layers 인자 형태가 통하는지.
      - name: 운영 이미지 빌드
        run: docker build -t petopia:ci-${{ github.sha }} .

      # 빌드 성공만으로는 이미지가 실제로 뜨는지 알 수 없다.
      # 이 job 에는 이미 MySQL 과 Redis 가 떠 있으므로, release 프로필로
      # 컨테이너를 실제 기동해 헬스체크 200 까지 확인한다. AWS 없이
      # 배포 산출물 전 구간을 검증할 수 있는 유일한 지점이다.
      #
      # 확인되는 것: 클래스패스(레이어 분리가 깨지지 않았는지) / ENTRYPOINT /
      # release 프로필 설정 유효성 / Flyway 연결 / 헬스 엔드포인트 응답.
      #
      # --network host 를 쓰는 이유: compose 가 MySQL·Redis 를 러너 호스트의
      # 포트로 공개하므로, 컨테이너가 127.0.0.1 로 그대로 접근할 수 있다.
      - name: 이미지 스모크 테스트 (release 프로필 기동 + 헬스체크)
        run: |
          set -uo pipefail

          # 이 값들은 CI 전용이다. compose 의 로컬 계정과 일치시킨 것이고,
          # 러너 안에서만 살다 사라지는 컨테이너에 쓰인다.
          # ENTRY_QR_SECRET 은 32자 이상이어야 기동한다는 제약만 만족시키면 된다.
          docker run -d --name petopia-app-ci --network host \
            -e SPRING_PROFILES_ACTIVE=release \
            -e DB_HOST=127.0.0.1 -e DB_PORT=3306 \
            -e DB_DATABASE=petopia_db -e DB_USER=petopia_user \
            -e DB_PASSWORD='userpassword123!' \
            -e REDIS_HOST=127.0.0.1 -e REDIS_PORT=6379 \
            -e REDIS_PASSWORD='rootpassword123!' \
            -e ENTRY_QR_SECRET='ci-smoke-test-secret-not-for-production' \
            petopia:ci-${{ github.sha }}

          deadline=$(( SECONDS + 120 ))
          until curl -fsS http://127.0.0.1:8080/api/reservation/health > /dev/null 2>&1; do
            if ! docker ps --format '{{.Names}}' | grep -q '^petopia-app-ci$'; then
              echo "::error title=이미지 스모크 실패::컨테이너가 죽었다. 아래 로그를 확인한다."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=이미지 스모크 실패::120초 안에 헬스체크가 200을 반환하지 않았다."
              exit 1
            fi
            echo "앱 기동 대기 중... (${SECONDS}s)"
            sleep 3
          done
          echo "헬스체크 200 확인 (${SECONDS}s)"
          curl -fsS http://127.0.0.1:8080/api/reservation/health

      # if: failure() 는 "이전 단계 중 하나라도 실패했을 때" 다.
      # 준비 대기 실패와 Flyway/커넥션 실패를 이 한 단계가 모두 커버한다.
      - name: 실패 시 컨테이너 로그 덤프
        if: failure()
        run: |
          echo "----- docker compose ps -----"
          docker compose ps || true
          echo "----- mysql 로그 (마지막 300줄) -----"
          docker compose logs --tail=300 mysql || true
          echo "----- redis 로그 (마지막 50줄) -----"
          docker compose logs --tail=50 redis || true
          echo "----- 앱 컨테이너 상태 -----"
          docker ps -a --filter name=petopia-app-ci || true
          echo "----- 앱 컨테이너 로그 (마지막 300줄) -----"
          docker logs --tail=300 petopia-app-ci 2>&1 || true

      # 스모크 테스트가 성공하든 실패하든 정리한다.
      # --network host 로 8080 을 점유하고 있어 남겨두면 다음 단계에 영향을 준다.
      - name: 스모크 테스트 컨테이너 정리
        if: always()
        run: docker rm -f petopia-app-ci 2>/dev/null || true

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # run_attempt 가 없으면 "실패한 job 다시 실행" 시 같은 이름의 아티팩트가
          # 이미 존재해 업로드 자체가 실패한다.
          name: test-reports-${{ github.run_attempt }}
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
          # 컴파일 단계에서 실패하면 두 디렉터리가 아예 없다. 이유는 Gradle 로그에 이미 있다.
          if-no-files-found: ignore
