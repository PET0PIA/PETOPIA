spring:
  datasource:
    # 변수 이름과 기본값은 .env / docker-compose.release.yaml 과 정확히 일치시킨다.
    # 컨테이너와 앱이 서로 다른 DB/계정을 바라보는 사고를 막기 위함이다.
    #
    # DB_HOST 는 반드시 설정해야 한다. 운영은 인스턴스 2대로 나뉘어 있어
    # (A=앱, B=MySQL+Redis) DB 는 다른 호스트다. 값은 인스턴스 B 의 사설 IP다.
    # 기본값 localhost 로 떨어지면 앱이 자기 자신에게 접속을 시도하며 실패한다.
    #
    # 주의: DB_PASSWORD 가 비어 있으면 기동 자체가 실패한다.
    # Flyway 가 컨텍스트 리프레시 시점에 커넥션을 열기 때문이다.
    # (MyBatis 만 있을 때는 첫 질의까지 지연됐지만 지금은 아니다.)
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:petopia_db}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: ${DB_USER:petopia_user}
    password: ${DB_PASSWORD}
    hikari:
      # t3.micro(1GiB) 2대 구성에 맞춘 값이다.
      # 이전 값은 max=30 / min=30 이었는데, min==max 라 부팅 즉시 MySQL 커넥션
      # 30개를 열고 영구 유지했다. 커넥션 하나당 DB 쪽에 스레드 하나와
      # 스레드별 버퍼(sort/join/read, 수백 KB~1MB)가 붙어, 1GiB 인스턴스에서
      # Redis 와 메모리를 다투는 가장 큰 항목이었다.
      # DB 가 2 vCPU 이므로 동시 처리량 관점에서도 10이면 충분하다.
      maximum-pool-size: 10
      minimum-idle: 2
      keepalive-time: 30000

  data:
    redis:
      # REDIS_HOST 도 반드시 설정해야 한다. DB_HOST 와 같은 이유로,
      # 값은 인스턴스 B 의 사설 IP다.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3s
      lettuce:
        pool:
          enabled: true
          # Hikari 와 같은 이유로 축소했다(이전 max-active=16 / min-idle=4).
          # min-idle 을 0 으로 두면 실제로 Redis 를 쓸 때까지 커넥션을 잡지 않는다.
          # 현재 Redis 사용처는 HealthCheckService 뿐이라 상시 유휴 커넥션이
          # 필요 없다.
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 3s
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

logging:
  level:
    root: warn
    # SQL 로그는 남기지 않는다. 파라미터에 개인정보가 섞여 들어갈 수 있다.
    com.ms.petopia: info

petopia:
  reservation:
    entry-qr-secret: ${ENTRY_QR_SECRET}
  toss:
    client-key: ${TOSS_CLIENT_KEY}
    secret-key: ${TOSS_SECRET_KEY}
    security-key: ${TOSS_SECURITY_KEY}
    api-version: ${TOSS_API_VERSION:2024-06-01}
  storage:
    # 기본값을 두지 않는다. 값이 비면 기동 자체가 실패해야 한다.
    # 기본값을 남겨두면 SSM 등록을 빠뜨렸을 때 운영 트래픽이 개발 버킷에
    # 파일을 쓰는 것을 아무도 알아채지 못한다.
    # 나머지 항목(region / presign-expiry / prefix)은 application.yaml 의
    # 값을 그대로 쓴다. 환경에 따라 달라질 값이 아니다.
    bucket: ${S3_BUCKET}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

cookie:
  # 운영을 HTTPS로 서비스하면 Secure 쿠키로 refreshToken을 보호한다.
  # 도메인/ACM 없이 ALB(HTTP)로 시연할 때는 COOKIE_SECURE=false 로 내려야
  # 브라우저가 refreshToken 쿠키를 저장·전송한다. 안 내리면 로그인이 조용히 깨진다.
  secure: ${COOKIE_SECURE:true}

nts:
  service-key: ${NTS_SERVICE_KEY}

# 운영은 관리 엔드포인트(actuator)를 앱 포트(8080)와 분리한 8081에 노출한다.
# ALB 헬스체크가 8081/actuator/health/liveness 를 보고, 8081은 ALB 보안그룹에서만 접근하게 막는다.
# health 그룹·probes 설정은 application.yaml 에 공통으로 있다.
management:
  server:
    port: 8081
