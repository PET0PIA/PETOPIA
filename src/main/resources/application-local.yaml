spring:
  datasource:
    # docker-compose.yaml 의 mysql 서비스 기준 (petopia_db / petopia_user)
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:petopia_db}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: ${DB_USERNAME:petopia_user}
    password: ${DB_PASSWORD:userpassword123!}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # docker-compose 의 redis-server --requirepass 값과 동일해야 한다.
      password: ${REDIS_PASSWORD:rootpassword123!}
      timeout: 3s
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 3s

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

logging:
  level:
    # 매퍼 인터페이스가 이 패키지 아래에 있으므로 실행 SQL이 함께 찍힌다.
    com.ms.petopia: debug

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

cookie:
  # refreshToken 쿠키의 Secure 속성. 로컬은 http://localhost라 Secure=true면
  # 브라우저가 Set-Cookie 자체를 저장하지 않아 refresh가 항상 실패한다. local만 false.
  secure: false

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth/google/callback}

  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:8080/api/auth/oauth/naver/callback}

petopia:
  reservation:
    # 로컬 전용 기본값. 운영 환경은 별도 환경변수를 필수로 사용한다.
    entry-qr-secret: ${ENTRY_QR_SECRET:local-entry-qr-secret-change-before-release}
  toss:
    client-key: ${TOSS_CLIENT_KEY}
    secret-key: ${TOSS_SECRET_KEY}
    security-key: ${TOSS_SECURITY_KEY}
    api-version: ${TOSS_API_VERSION:2024-06-01}
  storage:
    # 개발용 버킷과 CloudFront 배포. 버킷 이름과 배포 도메인은 응답 URL 로 어차피
    # 공개되는 값이라 비밀이 아니다. 그래서 실값을 기본값으로 둬서, 팀원이 환경변수를
    # 세팅하지 않아도 로컬 기동과 테스트가 그대로 되게 한다.
    #
    # 기본값을 지우고 ${S3_BUCKET} 형태로만 적지 않는다. 테스트는 프로필을 지정하지
    # 않아 local 로 뜨므로(spring.profiles.default), 기본값이 사라지면 CI 의
    # @SpringBootTest 전체가 PlaceholderResolutionException 으로 죽는다.
    # (2026-08-04 NTS_SERVICE_KEY 로 같은 실패를 겪었다.)
    bucket: ${S3_BUCKET:petopia-bucket}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:https://d2jl6zs612zyt4.cloudfront.net}

nts:
  service-key: ${NTS_SERVICE_KEY}

anthropic:
  api-key: ${ANTHROPIC_API_KEY}


